<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Tracker</title>
<meta name="description" content="Plan study hours, focus with a timer, track tasks and habits — synced with your Google account.">
<meta name="theme-color" content="#001F53">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* ===== Design tokens — palette from the Tyson Foods enterprise brand guide ===== */
:root{
  --brand:#E51837;        /* Tyson Red */
  --brand-strong:#C8102E; /* Tyson Red shade — buttons / text (AA contrast) */
  --brand-soft:#FDE8EB;
  --navy:#001F53;         /* heritage navy */
  --navy-2:#0B2E6B;
  --burgundy:#78082A;     /* web Burgundy */
  --khaki:#F3EDE0;        /* web Khaki */
  --gold:#FEBF58;
  --bg:#F3EDE0;--card:#FFFFFF;--card-2:#FAF7F1;
  --ink:#1B1A19;--ink2:#5A544D;--muted:#8C857C;
  --line:#E6DFD1;--line-2:#D8CFBE;--axis:#C9BFAD;
  --good:#1E7F45;--good-soft:#E3F3E8;--goodT:#16683A;
  --bad:#C8102E;--bad-soft:#FBE4E7;--badT:#A50E26;
  --warn:#B45309;--accent:var(--navy);
  --wash:rgba(0,31,83,.06);--ring:rgba(0,31,83,.08);
  --shadow:0 1px 2px rgba(27,26,25,.06),0 4px 16px rgba(27,26,25,.05);
  --r:14px;--r-sm:10px;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --brand:#F0455C;--brand-strong:#E51837;--brand-soft:rgba(229,24,55,.16);
  --navy:#0A1B3D;--navy-2:#13295A;
  --bg:#0B1222;--card:#141D33;--card-2:#18233D;
  --ink:#F3EDE0;--ink2:#C7C0B3;--muted:#8E8A84;
  --line:#25304A;--line-2:#2F3B58;--axis:#3A4664;
  --good:#2FA35F;--good-soft:rgba(47,163,95,.16);--goodT:#5FD18F;
  --bad:#E5364F;--bad-soft:rgba(229,54,79,.16);--badT:#FF7A8C;
  --accent:#8FB3FF;--wash:rgba(143,179,255,.08);--ring:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
/* ===== App bar ===== */
header{position:sticky;top:0;z-index:15;background:var(--navy);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--brand)}
header .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:0 0 auto}
header .logo svg{width:18px;height:18px;stroke:#fff}
header h1{font-size:16.5px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.hdr-timer{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;cursor:pointer}
.hdr-timer:empty{display:none}
.mode{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;color:#fff}
.mode:empty{display:none}
.mode[data-act]{background:var(--brand);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#9AA5B8;display:inline-block}
.dot.cloud{background:#4ADE80}.dot.local{background:var(--gold)}
/* ===== Layout ===== */
main{max-width:1080px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:14;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.04)}
nav button{flex:1;border:0;background:none;color:var(--ink2);padding:8px 0 9px;font:600 11px var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-height:56px}
nav button svg.i{width:22px;height:22px}
nav button.on{color:var(--brand-strong)}
nav button.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:224px}
  nav{top:0;bottom:0;right:auto;width:224px;flex-direction:column;justify-content:flex-start;padding:84px 12px 16px;border-top:0;border-right:1px solid var(--line);gap:4px;box-shadow:none}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:14.5px;min-height:0}
  nav button:hover{background:var(--wash)}
  nav button.on{background:var(--brand-soft)}
  nav button.on::before{top:8px;bottom:8px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  header{position:fixed;left:0;right:0;padding-left:20px}
  main{padding:88px 28px 28px}
}
/* ===== Cards & type ===== */
.card{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15.5px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.card h2 .sp,.sp{flex:1}
.card h2 svg.i{color:var(--brand-strong)}
.sub{font-size:12.5px;color:var(--ink2);font-weight:500}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.grid>.card{margin-bottom:0}
@media(min-width:780px){.g2{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
@media(min-width:780px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--ring);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .v{font-size:26px;font-weight:800;margin:4px 0 6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .s{font-size:12px;color:var(--ink2)}
.page-title{font-size:22px;font-weight:800;margin:2px 0 4px;color:var(--ink)}
.page-sub{color:var(--ink2);margin:0 0 16px;font-size:14px}
/* ===== Pills, chips ===== */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;line-height:1.45}
.pill.good{background:var(--good);color:#fff}.pill.bad{background:var(--bad);color:#fff}
.pill.neutral{background:var(--line);color:var(--ink2)}.pill.warn{background:var(--gold);color:#3a2600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--card-2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.p1{background:var(--bad-soft);border-color:transparent;color:var(--badT)}
.chip.p2{background:#FFF3DC;border-color:transparent;color:#8A5A00}
.chip.od{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.tdy{background:var(--wash);border-color:transparent;color:var(--accent)}
@media (prefers-color-scheme:dark){.chip.p2{background:rgba(254,191,88,.15);color:var(--gold)}}
/* ===== Buttons & forms ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 15px;font:600 14px var(--font);cursor:pointer;white-space:nowrap;min-height:40px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.btn.pri:hover{background:var(--burgundy);border-color:var(--burgundy)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.big{padding:12px 22px;font-size:15.5px;min-height:48px;border-radius:12px}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px;border-radius:8px}
.btn.danger{color:var(--badT);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--wash)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{border:0;background:none;color:var(--ink2);width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--wash);color:var(--ink)}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 13px;font:600 13px var(--font);cursor:pointer;border-radius:8px}
.seg button.on{background:var(--navy);color:#fff}
.seg button:disabled{cursor:default}
input,select,textarea{font:500 14.5px var(--font);color:var(--ink);background:var(--card);border:1.5px solid var(--line-2);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--wash)}
@media (prefers-color-scheme:dark){input:focus,select:focus,textarea:focus{border-color:var(--accent)}}
textarea{min-height:96px;resize:vertical;line-height:1.45}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:12px}
label>input,label>select,label>textarea{margin-top:5px}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{width:auto;flex:1 1 130px;min-height:40px}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}.small{font-size:12.5px}
.good-t{color:var(--goodT);font-weight:700}.bad-t{color:var(--badT);font-weight:700}
.banner{border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-left-color:var(--gold)}.banner.err{border-left-color:var(--bad)}
.empty{text-align:center;padding:18px 10px;color:var(--ink2);font-size:13.5px}
.empty .ei{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;margin:0 auto 10px}
.empty .ei svg.i{width:24px;height:24px}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.empty .btn{margin-top:12px}
/* ===== Today ===== */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(229,24,55,.18)}
.hero h2{color:#fff}.hero .sub{color:rgba(255,255,255,.75)}
.hero .ring text{fill:#fff}
.hero .btn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.2)}
.hero .btn.pri{background:var(--brand);border-color:var(--brand)}
.greet{font-size:21px;font-weight:800;margin:0;position:relative;z-index:1}
.today-top{display:flex;gap:18px;align-items:center;position:relative;z-index:1;margin-top:12px}
.ring{flex:0 0 auto}.ring text{fill:var(--ink)}
.stat-l{font-size:12px;opacity:.8;font-weight:600}
.stat-v{font-size:22px;font-weight:800}
.wk{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1}
.wk div{flex:1;text-align:center;font-size:11px;font-weight:600;opacity:.85}
.wk span{display:block;height:26px;border-radius:7px;margin-bottom:3px;font-size:12px;line-height:26px;color:#fff;font-weight:700}
.tips{border:1.5px dashed var(--line-2);background:var(--card-2)}
.tips ol{margin:0;padding-left:20px;color:var(--ink2);font-size:13.5px}.tips li{margin:4px 0}
/* ===== Timer ===== */
.tdisp{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1.5px;margin:4px 0 0;line-height:1.05;color:var(--navy)}
@media (prefers-color-scheme:dark){.tdisp{color:var(--ink)}}
.tphase{text-align:center;color:var(--ink2);font-size:13px;margin:4px 0 10px;font-weight:500}
.prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .5s linear}
.tbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
/* ===== Tasks ===== */
.task{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:0}
.task.sub{padding-left:34px;background:linear-gradient(90deg,transparent 17px,var(--line) 17px,var(--line) 19px,transparent 19px)}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .ttl{font-weight:600;word-break:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);cursor:pointer;color:#fff;font-size:14px;padding:0;margin-top:1px;display:grid;place-items:center}
.ck:hover{border-color:var(--good)}
.ck.on{background:var(--good);border-color:var(--good)}
.ck.ip{border-color:var(--navy);background:conic-gradient(var(--navy) 0 50%,transparent 50% 100%)}
@media (prefers-color-scheme:dark){.ck.ip{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 50% 100%)}}
.mini{height:5px;background:var(--line);border-radius:3px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle}
.mini i{display:block;height:100%;background:var(--navy)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--brand-strong);color:#fff;border:0;box-shadow:0 6px 18px rgba(200,16,46,.35);display:grid;place-items:center;cursor:pointer;z-index:13}
.fab svg.i{width:26px;height:26px}
@media(min-width:900px){.fab{bottom:28px;right:28px}}
/* ===== Charts ===== */
.chart{position:relative;padding-left:32px}
.bars{position:relative;height:180px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--axis)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
.gl b{position:absolute;left:-32px;top:-8px;font-size:10.5px;font-weight:500;color:var(--muted);width:28px;text-align:right}
.bar{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar .f{width:100%;border-radius:5px 5px 0 0;min-height:0}
.bar .tg{position:absolute;left:-1px;right:-1px;border-top:2px dashed var(--ink2);opacity:.7}
.bar:hover .f{filter:brightness(1.12)}
.xl{display:flex;gap:3px;font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:500}
.xl span{flex:1;text-align:center;overflow:visible;white-space:nowrap;min-width:0;display:flex;justify-content:center}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px;font-weight:500}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{border-top:2px dashed var(--ink2);height:0;border-radius:0;width:16px;vertical-align:3px}
.hb{display:grid;grid-template-columns:minmax(90px,160px) 1fr 60px;gap:8px 10px;align-items:center;font-size:13px}
.hb .tr{height:14px;background:var(--line);border-radius:0 5px 5px 0}
.hb .tr i{display:block;height:100%;background:var(--navy);border-radius:0 5px 5px 0}
@media (prefers-color-scheme:dark){.hb .tr i,.mini i{background:var(--accent)}}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
/* ===== Calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:600}
.cell{aspect-ratio:1;border-radius:6px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.cell.good{background:var(--good);color:#fff}.cell.bad{background:var(--bad);color:#fff}
.cell.off{background:repeating-linear-gradient(45deg,var(--line),var(--line) 3px,transparent 3px,transparent 6px);color:var(--ink2)}
.cell.blank{background:none}
.cell.now{outline:2.5px solid var(--navy);outline-offset:1px}
.months{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:780px){.months{grid-template-columns:repeat(4,1fr)}}
.months .mt{font-size:12px;font-weight:700;margin-bottom:5px}
.months .cell{font-size:0;border-radius:3px}
/* ===== Tables ===== */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* ===== Habits ===== */
.hg{overflow-x:auto;margin:0 -4px;padding:0 4px}
.hg table{width:auto}
.hg td,.hg th{padding:2px;border:0;text-align:center}
.hg th{font-size:10px;font-weight:600;color:var(--muted);min-width:30px;text-transform:none;letter-spacing:0}
.hg td.nm{text-align:left;padding-right:12px;font-size:13px;font-weight:600;position:sticky;left:0;background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hc{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--line-2);background:var(--card);cursor:pointer;padding:0;color:#fff;font-size:12px;font-weight:700}
.hc.on{background:var(--good);border-color:var(--good)}
.hc.miss{background:var(--bad-soft);border-color:transparent;color:var(--badT)}
.hc:disabled{opacity:.35;cursor:default}
.hab{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:500}
.hab:last-child{border-bottom:0}
.hab.on span{color:var(--muted);text-decoration:line-through}
/* ===== Goal bar ===== */
.gbar{position:relative;height:16px;background:var(--line);border-radius:8px;overflow:visible;margin:12px 0 6px}
.gbar i{display:block;height:100%;border-radius:8px}
.gbar u{position:absolute;top:-5px;bottom:-5px;border-left:2.5px solid var(--ink);text-decoration:none}
/* ===== Cascade ===== */
.casc{display:grid;gap:14px;font-size:13.5px}
.cr{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"lb num pill" "br br br";gap:6px 10px;align-items:center}
.cr .lb{grid-area:lb}.cr .br{grid-area:br}.cr .num{grid-area:num}.cr .pill{grid-area:pill;justify-self:end}
@media(min-width:780px){.casc{gap:10px}.cr{grid-template-columns:130px 1fr 120px 118px;grid-template-areas:"lb br num pill"}}
.hero-acts{margin-top:14px;position:relative;z-index:1}
.hero::after{width:160px;height:160px;right:-50px;top:-50px}
.casc .lb{color:var(--ink);white-space:nowrap;font-weight:600}
.casc .br{height:10px;background:var(--line);border-radius:5px;position:relative;overflow:hidden;min-width:40px}
.casc .br i{display:block;height:100%;border-radius:5px}
.casc .br u{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);text-decoration:none}
.casc .num{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px;white-space:nowrap;text-align:right;font-weight:600}
/* ===== Plan tree ===== */
.tree details{border-left:2px solid var(--line);margin-left:9px;padding-left:8px}
.tree>details{border-left:0;margin-left:0;padding-left:0}
.tree summary{display:flex;align-items:center;gap:8px;padding:10px 4px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line);font-size:13.5px}
.tree summary::-webkit-details-marker{display:none}
.tree summary:before{content:'›';color:var(--muted);width:12px;font-size:18px;line-height:1;transition:transform .15s;flex:0 0 auto}
.tree details[open]>summary:before{transform:rotate(90deg)}
.tree .nm{flex:1;font-weight:600;min-width:0}
.tree .num{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12.5px;white-space:nowrap;font-weight:600}
.tree .dr{display:flex;gap:8px;align-items:center;padding:7px 4px 7px 24px;border-bottom:1px solid var(--line);font-size:13px}
.tree .dr .nm{font-weight:500}
/* ===== Onboarding ===== */
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--brand)}
.step-k{font-size:12px;font-weight:700;color:var(--brand-strong);text-transform:uppercase;letter-spacing:.6px}
[data-step].hidden{display:none}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk-grid label{margin:0;text-align:center}
.wk-grid input{text-align:center;padding:9px 2px;font-weight:700}
.preset{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;white-space:normal;padding:9px 12px;min-height:0}
.preset small{font-weight:500;color:var(--ink2);font-size:11.5px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media(min-width:640px){.presets{grid-template-columns:repeat(4,1fr)}}
.sumbox{background:var(--wash);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:14px 0 12px;line-height:1.6}
.welcome{max-width:460px;margin:28px auto;text-align:center;padding:30px 22px}
.welcome .mark{width:72px;height:72px;border-radius:20px;background:var(--brand);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 24px rgba(229,24,55,.3)}
.welcome .mark svg{width:38px;height:38px;stroke:#fff}
.welcome h2{justify-content:center;font-size:24px;font-weight:800;margin:0 0 8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1F1F1F;border:1.5px solid #DADCE0;border-radius:12px;padding:12px;font:600 15.5px var(--font);cursor:pointer;min-height:50px}
.gbtn:hover{background:#F8F9FA}
.feat{display:grid;gap:10px;text-align:left;margin:20px 0 4px}
.feat div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2)}
.feat svg.i{color:var(--brand-strong);margin-top:1px}
/* ===== Overlays ===== */
.ov{position:fixed;inset:0;background:rgba(0,15,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .15s}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:800}
@media(min-width:640px){.ov{align-items:center}.modal{border-radius:20px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:.6}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B1A19;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:50;display:none;max-width:92vw;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{background:none;border:0;color:var(--gold);font:700 14px var(--font);cursor:pointer;padding:0}
@media(min-width:900px){#toast{bottom:28px;left:calc(50% + 112px)}}
#tip{position:fixed;pointer-events:none;background:#1B1A19;color:#fff;font-size:12px;padding:7px 9px;border-radius:7px;z-index:60;display:none;max-width:240px;line-height:1.4}
.loading{padding:70px 10px;text-align:center;color:var(--ink2);font-weight:500}
.loading::before{content:'';display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3.5px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:var(--brand-strong);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:900px){.fab{display:none}}
</style>

const S={settings:null,tasks:new Map(),days:new Map()};
const UI={onboard:false,busy:'',authMsg:'',update:null,tab:'today',year:new Date().getFullYear(),q:'all',month:'all',tf:{status:'open',pri:'all',subj:'all',who:'all',q:''},hMonth:null,ready:false,loadErr:'',open:new Set(),sheetUrl:'',lastLoad:0};
const IP={ /* simple line icons (24px grid) */
  today:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  tasks:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  habits:'<path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',play:'<path d="M7 4l13 8-13 8z"/>',pause:'<path d="M8 5v14M16 5v14"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M9 9l2 2 4-4"/>',
  flame:'<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-3-1 2-2 4-2 7 0 4 3 7 7 7z"/>',

  google:'<circle cx="12" cy="12" r="9"/><path d="M12 12h8M12 7v10"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  wifi:'<path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/>',devices:'<rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M6 18h6"/><rect x="17" y="8" width="5" height="12" rx="1"/>'
};
const ic=(n,cls)=>`<svg class="i ${cls||''}" viewBox="0 0 24 24" aria-hidden="true">${IP[n]||''}</svg>`;
const TABS_UI=[['today','today','Today'],['tasks','tasks','Tasks'],['habits','habits','Habits'],['report','report','Reports'],['setup','setup','Settings']];
function empty(icon,title,text,btn){return `<div class="empty"><div class="ei">${ic(icon)}</div><b>${title}</b>${text}${btn||''}</div>`}
function pageHead(title,sub,right){return `<div class="row" style="align-items:flex-end;margin-bottom:14px"><div style="flex:1;min-width:0"><div class="page-title">${title}</div><div class="page-sub" style="margin:0">${sub}</div></div>${right||''}</div>`}

function planEnd(){return maxS(String(S.settings.goalDate).slice(0,4)+'-12-31','2028-12-31')}
function years(){const a=+S.settings.startDate.slice(0,4),b=+planEnd().slice(0,4);const o=[];for(let y=a;y<=b;y++)o.push(y);return o}

/* ============ GOOGLE ACCOUNT + SYNC (your own Google Drive) ============ */
const CFG={clientId:((window.APP_CONFIG||{}).clientId||'').includes('PASTE')?'':((window.APP_CONFIG||{}).clientId||''),
  scope:'https://www.googleapis.com/auth/drive.file openid email profile'};
try{if(!CFG.clientId)CFG.clientId=localStorage.getItem('st_client_id')||''}catch(e){}
const SHEETS='https://sheets.googleapis.com/v4/spreadsheets/',DRIVE='https://www.googleapis.com/drive/v3/files',APP_TAG='study-tracker';
const SCHEMA=4;
const TABS={
  Settings:['Setting','Value','','Subjects','Assigned to','Habits'],
  Plans:['Effective from','Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
  DayOverrides:['Date','Planned hrs','Rest day'],
  Tasks:['ID','Parent ID','Task','Subject','Assigned to','Priority','Status','Start','Due','Est hrs','Extra mins','Completed on','Notes','Created'],

};
const SKEYS=['userName','examType','goalName','startDate','goalDate','goalHours','habitTargetPct','pomoWork','pomoShort','pomoLong','pomoEvery'];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const Auth={token:'',exp:0,email:'',name:'',client:null,
  init(){const t=LS.get('st_tok',null);if(t&&t.exp>Date.now()+60000){this.token=t.token;this.exp=t.exp}const u=LS.get('st_user',{});this.email=u.email||'';this.name=u.name||''},
  valid(){return !!this.token&&this.exp>Date.now()+60000},
  gisReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2)},
  setup(){
    if(this.client||!this.gisReady()||!CFG.clientId)return;
    this.client=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:CFG.scope,hint:this.email||undefined,
      callback:r=>this.onToken(r),error_callback:e=>{UI.authMsg=(e&&e.type==='popup_closed')?'Sign-in window closed.':'Sign-in was blocked — tap Sign in again.';render()}});
  },
  request(){this.setup();if(!this.client){toast(CFG.clientId?'Google sign-in is still loading — check your internet':'App not configured yet');return}

    if(!r||r.error){UI.authMsg='Google sign-in failed ('+((r&&r.error)||'unknown')+').';render();return}

    await afterSignIn();
  },
  signOut(){try{if(this.token&&this.gisReady())google.accounts.oauth2.revoke(this.token,()=>{})}catch(e){}
    this.token='';this.exp=0;this.email='';LS.del('st_tok');LS.del('st_user');LS.del(cacheKey());LS.del('st_sheet')}
};
async function gapi(method,url,body){
  if(!Auth.valid())throw{code:'auth'};
  let r;try{r=await fetch(url,{method,headers:{Authorization:'Bearer '+Auth.token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw{code:'net'}}
  if(r.status===401){Auth.token='';LS.del('st_tok');throw{code:'auth'}}
  if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw{code:'http',status:r.status,msg:t.slice(0,300)}}
  return r.status===204?null:r.json();
}
const enc=encodeURIComponent;

/* ---- Spreadsheet in the user's Drive ---- */
const DB={sheetId:LS.get('st_sheet',''),tabIds:{}};
function cacheKey(){return 'st_cache_'+(DB.sheetId||'none')}
async function findSheet(){
  const q=`appProperties has { key='app' and value='${APP_TAG}' } and trashed=false`;
  const r=await gapi('GET',`${DRIVE}?q=${enc(q)}&orderBy=createdTime desc&fields=files(id,name,createdTime)&spaces=drive`);
  return (r.files||[])[0]||null;
}
async function loadTabIds(){
  const r=await gapi('GET',`${SHEETS}${DB.sheetId}?fields=sheets.properties(sheetId,title)`);
  DB.tabIds={};(r.sheets||[]).forEach(s=>DB.tabIds[s.properties.title]=s.properties.sheetId);
  const missing=Object.keys(TABS).filter(t=>DB.tabIds[t]==null);
  if(missing.length){ // upgrade an older sheet: add new tabs, never remove anything
    const u=await gapi('POST',`${SHEETS}${DB.sheetId}:batchUpdate`,{requests:missing.map(t=>({addSheet:{properties:{title:t,gridProperties:{frozenRowCount:1}}}}))});
    u.replies.forEach((x,i)=>DB.tabIds[missing[i]]=x.addSheet.properties.sheetId);
    await gapi('POST',`${SHEETS}${DB.sheetId}/values:batchUpdate`,{valueInputOption:'RAW',data:missing.map(t=>({range:`${t}!A1`,values:[TABS[t]]}))});
  }
}
async function createSheet(d){
  const name='Study Tracker'+(d.settings.userName?' — '+d.settings.userName:'')+(d.settings.examType?' ('+d.settings.examType+')':'');
  const f=await gapi('POST',`${DRIVE}?fields=id`,{name,mimeType:'application/vnd.google-apps.spreadsheet',appProperties:{app:APP_TAG}});
  DB.sheetId=f.id;LS.set('st_sheet',f.id);
  const meta=await gapi('GET',`${SHEETS}${f.id}?fields=sheets.properties(sheetId,title)`);
  const first=meta.sheets[0].properties.sheetId,names=Object.keys(TABS);
  const reqs=[{updateSheetProperties:{properties:{sheetId:first,title:names[0],gridProperties:{frozenRowCount:1}},fields:'title,gridProperties.frozenRowCount'}}]

function clone(o){return JSON.parse(JSON.stringify(o))}
function applyOp(o){
  switch(o.t){
    case'sess':if(!D.sessions.some(x=>x.id===o.s.id))D.sessions.push(o.s);if(o.s.taskId){const t=D.tasks.find(x=>x.id===o.s.taskId);if(t&&t.status==='Not started')t.status='In progress'}break;

    case'task':{const i=D.tasks.findIndex(x=>x.id===o.task.id);if(i>=0)D.tasks[i]=o.task;else D.tasks.push(o.task);break}

async function rowsOf(tab,col){const r=await gapi('GET',`${SHEETS}${DB.sheetId}/values/${enc(tab+'!'+col+':'+col)}?valueRenderOption=UNFORMATTED_VALUE`);return (r.values||[]).map(x=>x[0])}

async function pushOp(o){

    case'sess':{const ids=await rowsOf('Sessions','A');if(!ids.includes(o.s.id))await append('Sessions',[sessRow(o.s)]);break}

      if(o.statusFrom){/* nothing */}break;

async function sync(full){

/* ============ DATA HELPERS ============ */
function dayObj(d){let r=S.days.get(d);if(!r){r={date:d,off:null,target:null,sessions:[],habits:{}};S.days.set(d,r)}return r}
function dayMins(d){const r=S.days.get(d);return r?r.sessions.reduce((a,s)=>a+(+s.mins||0),0):0}
function planHrs(d){return +planFor(d)[parse(d).getDay()]||0}
function dayTarget(d){const r=S.days.get(d);return (r&&r.target!=null?+r.target:planHrs(d))*60}
function isOff(d){const r=S.days.get(d);return (r&&r.off===true)||dayTarget(d)<=0}
function effTarget(d){return isOff(d)?0:dayTarget(d)}
function dayStatus(d){
  const t=todayStr();
  if(d<S.settings.startDate)return'pre'; if(d>t)return'future';
  if(isOff(d))return'off';
  if(dayMins(d)>=dayTarget(d))return'good'; if(d===t)return'pending'; return'bad';
}
function taskMinsMap(){const m={};for(const r of S.days.values())for(const s of r.sessions)if(s.taskId)m[s.taskId]=(m[s.taskId]||0)+(+s.mins||0);return m}
function taskKeyDate(t){return t.due||t.createdAt||todayStr()}
function isOverdue(t){return t.status!=='Completed'&&t.due&&t.due<todayStr()}
function children(id){return [...S.tasks.values()].filter(c=>c.parentId===id)}
/** Period summary — same rules as the Google Sheet rollups */
function psum(a,b){
  const t=todayStr();a=maxS(a,S.settings.startDate);b=minS(b,planEnd());
  const o={T:0,TD:0,ST:0,met:0,miss:0,status:'neutral',label:'—'};if(a>b)return o;
  for(const d of dates(a,b)){const tg=effTarget(d);o.T+=tg;if(d<t)o.TD+=tg;o.ST+=dayMins(d);const x=dayStatus(d);if(x==='good')o.met++;else if(x==='bad')o.miss++}
  if(a>t){o.status='neutral';o.label='Upcoming'}
  else if(b<t){const ok=o.ST>=o.T;o.status=ok?'good':'bad';o.label=ok?'Achieved':'Missed'}
  else{const ok=o.ST>=o.TD;o.status=ok?'good':'bad';o.label=ok?'On track':'Behind'}
  return o;
}
function monthRange(y,m){return[`${y}-${pad(m+1)}-01`,`${y}-${pad(m+1)}-${pad(new Date(y,m+1,0).getDate())}`]}
function quarterRange(y,q){return[`${y}-${pad(q*3+1)}-01`,monthRange(y,q*3+2)[1]]}
function period(){
  const st=S.settings.startDate;
  if(UI.year==='all')return{a:st,b:planEnd(),label:'All years',kind:'all'};
  const y=+UI.year;
  if(UI.month!=='all'){const m=+UI.month,[a,b]=monthRange(y,m);return{a,b,label:`${MONTHS[m]} ${y}`,kind:'month'}}
  if(UI.q!=='all'){const q=+UI.q,[a,b]=quarterRange(y,q);return{a,b,label:`Q${q+1} ${y}`,kind:'quarter'}}
  return{a:`${y}-01-01`,b:`${y}-12-31`,label:String(y),kind:'year'};
}
function stats(a,b){
  let mins=0,tmins=0,met=0,elig=0,studyDays=0;const subj={};
  for(const d of dates(a,b)){
    const m=dayMins(d);mins+=m;if(m>0)studyDays++;
    const st=dayStatus(d);
    if(st==='good'){met++;elig++;tmins+=dayTarget(d)}else if(st==='bad'){elig++;tmins+=dayTarget(d)}
    const r=S.days.get(d);if(r)for(const s of r.sessions){const k=s.subject||'Unassigned';subj[k]=(subj[k]||0)+(+s.mins||0)}
  }
  return{mins,tmins,met,elig,studyDays,subj};
}
function streaks(){
  const t=todayStr();let cur=0,d=dayStatus(t)==='good'?t:addDays(t,-1);
  for(let i=0;i<3000&&d>=S.settings.startDate;i++){const s=dayStatus(d);if(s==='good')cur++;else if(s!=='off')break;d=addDays(d,-1)}
  let best=0,run=0;for(const x of dates(S.settings.startDate,t)){const s=dayStatus(x);if(s==='good'){run++;best=Math.max(best,run)}else if(s==='bad')run=0}
  return{cur,best};
}

/* ============ TIMER (state kept on this device) ============ */
const TKEY='upsc_timer_v1';
const T={s:null,actx:null};

  if(T.s.mode==='pomo'&&T.s.phase==='break'){Object.assign(T.s,{phase:'work',running:false,acc:0,startedAt:0});tSave();renderTimer();return}
  const ms=tElapsed(),start=T.s.sessStart||(Date.now()-ms),task=T.s.taskId,subj=T.s.subject,mode=T.s.mode==='pomo'?'pomodoro':'stopwatch';

function tick(){

        const start=T.s.sessStart||hit-L,task=T.s.taskId,subj=T.s.subject;

function fmtClock(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`}

function taskRow(t,tm,sub){
  const kids=children(t.id),done=t.status==='Completed';
  let tot=(tm[t.id]||0)+(+t.extraMins||0);for(const k of kids)tot+=(tm[k.id]||0)+(+k.extraMins||0);
  const est=(+t.estHrs||0)*60,kd=kids.filter(k=>k.status==='Completed').length,today=todayStr();
  let due='';if(t.due){due=isOverdue(t)?`<span class="chip od">Overdue · ${fmtShort(t.due)}</span>`:t.due===today&&!done?`<span class="chip tdy">Due today</span>`:`<span class="chip">Due ${fmtShort(t.due)}</span>`}
  return `<div class="task ${sub?'sub':''} ${done?'done':''}">
    <button class="ck ${done?'on':t.status==='In progress'?'ip':''}" data-act="task-toggle" data-id="${esc(t.id)}" aria-label="mark complete">${done?'✓':''}</button>

        ${t.assignee&&t.assignee!=='Self'?`<span class="chip">👤 ${esc(t.assignee)}</span>`:''}
        ${due}<span class="small ink2">⏱ ${fmtHM(tot)}${est?` / ${H(est)}h est`:''}</span>
        ${est?`<span class="mini"><i style="width:${Math.min(100,pct(tot,est))}%;${tot>est?'background:var(--bad)':''}"></i></span>`:''}
        ${kids.length?`<span class="small ink2">· ${kd}/${kids.length} subtasks</span>`:''}
      </div>
    </div>
    ${!sub&&!t.parentId?`<button class="btn sm ghost" data-act="task-sub" data-id="${esc(t.id)}" title="Add subtask">+ sub</button>`:''}
  </div>`;
}
function taskMatches(t,p){
  const f=UI.tf,k=taskKeyDate(t);
  if(UI.year!=='all'&&!(k>=p.a&&k<=p.b)&&!(isOverdue(t)&&f.status==='overdue'))return false;
  if(f.status==='open'&&t.status==='Completed')return false;
  if(f.status==='overdue'&&!isOverdue(t))return false;
  if(STATUS.includes(f.status)&&t.status!==f.status)return false;
  if(f.pri!=='all'&&String(t.priority||3)!==f.pri)return false;
  if(f.subj!=='all'&&t.subject!==f.subj)return false;
  if(f.who!=='all'&&(t.assignee||'Self')!==f.who)return false;
  if(f.q&&!(t.title+' '+(t.notes||'')).toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}

}
function viewTasks(){

  const tops=all.filter(t=>!t.parentId||!S.tasks.has(t.parentId)).filter(t=>match.has(t.id)||children(t.id).some(c=>match.has(c.id))).sort(sorter);
  const inP=all.filter(t=>{const k=taskKeyDate(t);return UI.year==='all'||(k>=p.a&&k<=p.b)});
  const dn=inP.filter(t=>t.status==='Completed').length,od=all.filter(isOverdue).length;

    <input id="tfq" data-in="tf-q" placeholder="Search tasks…" value="${esc(f.q)}">
  </div>
  <div class="card">
    <h2>Tasks · ${esc(p.label)}<span class="sp"></span><span class="sub">${dn} of ${inP.length} done</span>${od?statusPill('bad',od+' overdue'):inP.length?statusPill('good','None overdue'):''}</h2>
    ${list||empty('tasks',all.length?'No tasks match these filters':'Plan your first task',all.length?'Try “All statuses” or another month.':'Example: “Polity — Laxmikanth Part 1”, then add a subtask for each chapter.',all.length?'':`<button class="btn pri" data-act="task-new">${ic('plus')} New task</button>`)}
  </div>

/* ---------- REPORT ---------- */
function barChart(items){
  const mx=Math.max(1,...items.map(i=>Math.max(i.v,i.t)));
  const step=mx>40?Math.ceil(mx/4/10)*10:mx>8?Math.ceil(mx/4):Math.max(1,Math.ceil(mx/4*2)/2);
  const top=step*4,gl=[1,2,3,4].map(i=>`<div class="gl" style="bottom:${i*25}%"><b>${Math.round(step*i*10)/10}h</b></div>`).join('');
  const every=items.length>20?Math.ceil(items.length/12):1;
  return `<div class="chart"><div class="bars">${gl}${items.map(i=>`<div class="bar" data-tip="${esc(i.tip)}"><div class="f" style="height:${i.v/top*100}%;background:${i.c}"></div>${i.t>0?`<div class="tg" style="bottom:${i.t/top*100}%"></div>`:''}</div>`).join('')}</div>
  <div class="xl">${items.map((i,k)=>`<span>${k%every===0?esc(i.l):''}</span>`).join('')}</div></div>
  <div class="legend"><span><i style="background:var(--good)"></i>✓ Target met</span><span><i style="background:var(--bad)"></i>✕ Below target</span><span><i class="dash"></i>Target</span></div>`;
}
function monthBlocks(a,b){const o=[];let d=parse(maxS(a,S.settings.startDate));d.setDate(1);const e=parse(b);while(d<=e){o.push([d.getFullYear(),d.getMonth()]);d.setMonth(d.getMonth()+1)}return o}
function calMonth(y,m,showNums){
  const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),t=todayStr();
  let h=showNums?DOW.map(d=>`<div class="h">${d[0]}</div>`).join(''):'';
  for(let i=0;i<first;i++)h+=`<div class="cell blank"></div>`;
  for(let i=1;i<=last;i++){const d=`${y}-${pad(m+1)}-${pad(i)}`,s=dayStatus(d);const c=s==='good'?'good':s==='bad'||s==='pending'?'bad':s==='off'?'off':'';
    h+=`<div class="cell ${c} ${d===t?'now':''}" data-tip="${fmtDate(d)} · ${fmtHM(dayMins(d))} / ${H(dayTarget(d))}h${s==='off'?' · rest day':s==='pending'?' · in progress':''}">${showNums?i:''}</div>`}
  return `<div class="cal">${h}</div>`;
}
/* Plan drill-down: Year → Quarter → Month → Week → Day */
function treeNode(key,label,a,b){
  const o=psum(a,b),open=UI.open.has(key);
  return `<details data-node="${esc(key)}" ${open?'open':''}><summary><span class="nm">${esc(label)}</span><span class="num">${H(o.ST)} / ${H(o.T)}h</span>${statusPill(o.status,o.label)}</summary><div class="kids">${open?treeKids(key):''}</div></details>`;
}
function treeKids(key){
  const p=key.split(':'),st=S.settings.startDate,end=planEnd();
  if(p[0]==='y'){const y=+p[1];return [0,1,2,3].map(q=>{const[a,b]=quarterRange(y,q);return b<st||a>end?'':treeNode(`q:${y}:${q}`,`Q${q+1} ${y} · ${MONTHS[q*3]}–${MONTHS[q*3+2]}`,a,b)}).join('')}
  if(p[0]==='q'){const y=+p[1],q=+p[2];return [0,1,2].map(i=>{const m=q*3+i,[a,b]=monthRange(y,m);return b<st||a>end?'':treeNode(`m:${y}:${m}`,`${MONTHS[m]} ${y}`,a,b)}).join('')}
  if(p[0]==='m'){const y=+p[1],m=+p[2],[a,b]=monthRange(y,m),groups=new Map();
    for(const d of dates(maxS(a,st),b)){const w=wkStart(d);if(!groups.has(w))groups.set(w,[]);groups.get(w).push(d)}
    return [...groups.entries()].map(([w,ds])=>treeNode(`w:${ds[0]}:${ds[ds.length-1]}`,`Week ${fmtShort(ds[0])} – ${fmtShort(ds[ds.length-1])}`,ds[0],ds[ds.length-1])).join('')}
  if(p[0]==='w'){return [...dates(p[1],p[2])].map(d=>{const s=dayStatus(d),k=s==='good'?'good':s==='bad'?'bad':'neutral',lb={good:'Met',bad:'Missed',pending:'In progress',off:'Rest',future:'Upcoming',pre:'—'}[s];

  return '';
}

function readPlanForm(){
  const v=id=>$('#'+id).value,lines=id=>v(id).split('\n').map(x=>x.trim()).filter(Boolean);
  const n={userName:v('p-name').trim(),examType:v('p-exam'),goalName:v('p-goal').trim()||'My study goal',startDate:v('p-start'),goalDate:v('p-gdate'),
    weekArr:formWeek(),goalHours:Math.max(0,+v('p-ghrs')||0),habitTargetPct:Math.min(100,Math.max(0,+v('p-hpct')||0)),
    pomo:{work:Math.max(1,+v('p-work')||25),short:Math.max(1,+v('p-short')||5),long:Math.max(1,+v('p-long')||15),every:Math.max(1,+v('p-every')||4)},
    subjects:lines('p-subj'),assignees:lines('p-who'),habits:lines('p-hab').map(x=>({id:x,name:x,active:true}))};
  if(!n.startDate||!n.goalDate||n.goalDate<=n.startDate){toast('Goal date must be after start date');return null}
  if(!n.weekArr.some(x=>x>0)){toast('Plan at least one study day');return null}
  if(!n.assignees.length)n.assignees=['Self'];
  if(!n.goalHours)n.goalHours=Math.round(planTotal(n.weekArr,n.startDate,n.goalDate));
  return n;
}
function viewOnboard(){
  if(!UI.step)UI.step=1;
  if(!UI.draft){const t=todayStr(),p=PRESETS['UPSC CSE'];
    UI.draft={userName:(Auth.name||'').split(' ')[0],examType:'UPSC CSE',goalName:p.goal,startDate:t,goalDate:`${+t.slice(0,4)+3}-${t.slice(5,7)}-01`,weekArr:[6,2,2,2,2,2,6],goalHours:0,habitTargetPct:80,
      pomo:{work:25,short:5,long:15,every:4},subjects:p.subjects,assignees:['Self','Mentor','Study group'],habits:HABITS_DEFAULT}}
  return `<div style="max-width:640px;margin:0 auto">
   <div class="steps" aria-hidden="true">${[1,2,3,4].map(n=>`<i class="${n<=UI.step?'on':''}"></i>`).join('')}</div>
   ${planForm(UI.draft,true)}
   <div class="row" style="margin-bottom:24px">${UI.step>1?`<button class="btn big" data-act="ob-back">Back</button>`:''}<span class="sp"></span>
    ${UI.step<4?`<button class="btn pri big" data-act="ob-next">Continue</button>`:`<button class="btn pri big" data-act="onboard">Create my tracker</button>`}</div>
   ${UI.step===4?`<p class="small muted" style="text-align:center;margin-top:-10px">A private sheet called “Study Tracker” will be created in your Google Drive. Only you can see it.</p>`:''}
  </div>`;
}
function updateBanner(){return UI.update?`<div class="banner">${ic('download')} <span style="flex:1">A new version of the app is ready.</span><button class="btn sm pri" data-act="update">Update now</button></div>`:''}
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
let installEvt=null;
function installHTML(){
  if(isStandalone())return `<div class="small good-t">✓ Installed on this device</div>`;
  if(installEvt)return `<button class="btn navy block" data-act="install">${ic('download')} Install app on this device</button>`;
  if(isIOS())return `<div class="small ink2">iPhone / iPad: tap <b>Share</b> <span aria-hidden="true">⎋</span> in Safari → <b>Add to Home Screen</b>.</div>`;
  return `<div class="small ink2">Open the browser menu (⋮) → <b>Install app</b> / <b>Add to Home screen</b>. On a laptop, use the install icon in Chrome or Edge's address bar.</div>`;
}

/* ============ MODAL / TOAST / TIP ============ */
function openModal(html){$('#modalRoot').innerHTML=`<div class="ov" data-act="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmBox(msg,yes){return new Promise(res=>{openModal(`<h3>${esc(msg)}</h3><div class="row"><button class="btn danger" id="cf-yes">${esc(yes||'Delete')}</button><button class="btn" id="cf-no">Cancel</button></div>`);$('#cf-yes').onclick=()=>{closeModal();res(true)};$('#cf-no').onclick=()=>{closeModal();res(false)}})}
let toastT;function toast(m,undo){const t=$('#toast');t.innerHTML='';const sp=document.createElement('span');sp.textContent=m;t.appendChild(sp);
  if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{t.style.display='none';undo()};t.appendChild(b)}
  t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',undo?6000:2800)}
const tip=$('#tip');
document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(!el){tip.style.display='none';return}tip.textContent=el.dataset.tip;tip.style.display='block';posTip(e)});
document.addEventListener('pointermove',e=>{if(tip.style.display==='block')posTip(e)});
document.addEventListener('scroll',()=>tip.style.display='none',true);
function posTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+12,y=e.clientY-h-12;if(x+w>innerWidth-6)x=e.clientX-w-12;if(x<6)x=6;if(y<6)y=e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details[data-node]'))return;const k=d.dataset.node;
  if(d.open){UI.open.add(k);const kids=d.querySelector(':scope > .kids');if(kids&&!kids.innerHTML)kids.innerHTML=treeKids(k)}else UI.open.delete(k)},true);

/* ============ ACTIONS ============ */
const ACT={
  tab:(el,id)=>{UI.tab=id;closeModal();try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}catch(e){}render();scrollTo(0,0)},
  reload:()=>{if(Auth.valid())sync(true);else Auth.request()},
  signin:()=>{if(Auth.valid()){if(DB.sheetId)sync(true);else afterSignIn()}else Auth.request()},
  update:()=>{if(UI.update)UI.update.postMessage('skip')},
  install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()},
  share:async()=>{const u=$('#share-url').value;try{if(navigator.share){await navigator.share({title:'Study Tracker',text:'Track study hours, tasks & habits — syncs with your Google account',url:u});return}}catch(e){return}try{await navigator.clipboard.writeText(u);toast('Link copied')}catch(e){$('#share-url').select();toast('Selected — copy it')}},
  signout:async()=>{const ok=await confirmBox(outbox.length?`Sign out? ${outbox.length} change(s) haven't synced yet and will be lost.`:'Sign out from this device? Your data stays in your Google Drive.','Sign out');if(!ok)return;Auth.signOut();DB.sheetId='';DB.tabIds={};D=Dsrv=null;outbox=[];S.settings=null;UI.onboard=false;render()},
  'cfg-save':()=>{const v=$('#cfg-id').value.trim();if(!v.endsWith('.apps.googleusercontent.com')){toast('That doesn\'t look like a Client ID');return}CFG.clientId=v;try{localStorage.setItem('st_client_id',v)}catch(e){}Auth.setup();render()},
  ov:(el,id,e)=>{if(e.target===el)closeModal()},
  'modal-close':()=>closeModal(),
  't-start':()=>tStart(),'t-pause':()=>tPause(),'t-reset':()=>tReset(),'t-stop':()=>tStopSave(),
  't-mode':(el,id)=>{if(T.s.running||T.s.acc>0)return;T.s.mode=id;T.s.phase='work';tSave();renderTimer()},
  't-preset':(el,id)=>{const[w,s,l]=id.split('-').map(Number);const st=clone(D.settings);st.pomoWork=w;st.pomoShort=s;st.pomoLong=l;op({t:'settings',settings:st,plans:clone(S.plans)});toast(`Pomodoro set to ${w}/${s}`)},
  habit:(el,id)=>{const d=el.dataset.date;if(d>todayStr())return;const r=S.days.get(d);op({t:'habit',date:d,name:id,val:!(r&&r.habits[id])})},
  'day-off':()=>{const t=todayStr(),r=S.days.get(t),pl=r&&r.target!=null?r.target:'';op({t:'day',date:t,planned:pl,rest:!(r&&r.off===true)})},
  'day-target':()=>{const t=todayStr();openModal(`<h3>Today's target</h3><label>Study hours for ${esc(fmtDate(t))}<input type="number" min="0" max="18" step="0.5" id="dt-h" value="${H(dayTarget(t))}"></label><div class="small muted" style="margin-bottom:10px">Only changes today. Your weekly plan for ${DOW[parse(t).getDay()]} stays ${planHrs(t)}h (change it in Setup).</div><div class="row"><button class="btn pri" data-act="day-target-save">Save</button><button class="btn" data-act="modal-close">Cancel</button></div>`)},
  'day-target-save':()=>{const t=todayStr(),h=Math.max(0,+$('#dt-h').value||0);closeModal();op({t:'day',date:t,planned:h,rest:false})},
  hm:(el,id)=>{const[y,m]=UI.hMonth.split('-').map(Number);const d=new Date(y,m-1+(+id),1);UI.hMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()},
  'task-new':()=>taskForm({id:'',title:'',status:'Not started',priority:3,assignee:'Self',subject:''},true),
  'task-sub':(el,id)=>{const p=S.tasks.get(id)||{};taskForm({id:'',title:'',parentId:id,status:'Not started',priority:p.priority||3,assignee:p.assignee||'Self',subject:p.subject||'',due:p.due||''},true)},
  'task-edit':(el,id)=>{const t=S.tasks.get(id);if(t)taskForm({...t},false)},
  'task-toggle':async(el,id)=>{const t=S.tasks.get(id);if(!t)return;const c={...t};if(c.status==='Completed'){c.status='In progress';c.completedAt=''}else{c.status='Completed';c.completedAt=todayStr()}if(c.status==='Completed')toast('Nice — task completed ✓');saveTask(c)},
  'task-save':async(el,id)=>{
    const title=$('#f-title').value.trim();if(!title){toast('Give the task a name');return}
    const old=id?S.tasks.get(id):null,t=old?{...old}:{id:'t'+uid(),createdAt:todayStr()};
    Object.assign(t,{title,parentId:$('#f-parent').value||'',subject:$('#f-subj').value,assignee:$('#f-who').value,priority:+$('#f-pri').value,status:$('#f-status').value,start:$('#f-start').value,due:$('#f-due').value,estHrs:+$('#f-est').value||0,extraMins:+$('#f-extra').value||0,notes:$('#f-notes').value});
    if(t.status==='Completed'&&!t.completedAt)t.completedAt=todayStr();if(t.status!=='Completed')t.completedAt='';
    closeModal();toast(old?'Task updated':'Task added');saveTask(t);
  },
  'task-del':(el,id)=>{const t=S.tasks.get(id);if(!t)return;const kids=children(id).map(k=>({...k}));const keep={...t};closeModal();op({t:'deltask',id});
    toast(kids.length?`Task and ${kids.length} subtask(s) deleted`:'Task deleted',()=>{op({t:'task',task:keep});kids.forEach(k=>op({t:'task',task:k}))})},
  'log-manual':()=>{
    const open=[...S.tasks.values()].filter(x=>x.status!=='Completed');
    openModal(`<h3>Log study time</h3><div class="fr"><label>Date<input type="date" id="l-date" value="${todayStr()}" max="${todayStr()}"></label><label>Subject<select id="l-subj"><option value="">—</option>${S.settings.subjects.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Hours<input type="number" min="0" step="1" id="l-h" value="1"></label><label>Minutes<input type="number" min="0" max="59" step="5" id="l-m" value="0"></label></div><label>Task<select id="l-task"><option value="">— No specific task —</option>${open.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('')}</select></label><label>Note<input id="l-note" placeholder="optional"></label><div class="row"><button class="btn pri" data-act="log-save">Log time</button><button class="btn" data-act="modal-close">Cancel</button></div>`);
  },
  'log-save':async()=>{const mins=(+$('#l-h').value||0)*60+(+$('#l-m').value||0);if(mins<=0){toast('Enter some time');return}const d=$('#l-date').value||todayStr();const o={date:d,mins,subject:$('#l-subj').value,taskId:$('#l-task').value,note:$('#l-note').value,mode:'manual'};closeModal();logSession(o)},
  'sess-del':(el,id)=>{const r=S.days.get(el.dataset.date);const x=r&&r.sessions.find(q=>q.id===id);if(!x)return;const keep={...x};op({t:'delsess',id});toast(`Removed ${fmtHM(keep.mins)} session`,()=>op({t:'sess',s:keep}))},
  'tips-done':()=>{LS.set('st_tips_done',true);render()},
  'ob-next':()=>{const n=readPlanForm();if(!n)return;n.goalHours=+$('#p-ghrs').value||0;UI.draft={...n,habits:n.habits.map(h=>h.name)};UI.step=Math.min(4,UI.step+1);render();scrollTo(0,0)},
  'ob-back':()=>{const n=readPlanForm();if(n){n.goalHours=+$('#p-ghrs').value||0;UI.draft={...n,habits:n.habits.map(h=>h.name)}}UI.step=Math.max(1,UI.step-1);render();scrollTo(0,0)},
  'set-save':()=>{const n=readPlanForm();if(!n)return;op({t:'settings',settings:settingsFromForm(n),plans:plansWith(n.weekArr)});toast('Settings saved ✓')},
  onboard:async()=>{
    const n=readPlanForm();if(!n)return;
    if(!Auth.valid()){Auth.request();toast('Please sign in again, then tap Create');return}
    UI.busy='Creating your private Google Sheet…';render();
    try{const d={settings:settingsFromForm(n),plans:[{from:n.startDate<todayStr()?n.startDate:todayStr(),w:n.weekArr}],overrides:{},tasks:[],sessions:[],habits:[]};
      await createSheet(d);Dsrv=d;D=clone(d);outbox=[];persist();buildS();Sync.last=Date.now();UI.onboard=false;UI.busy='';UI.tab='today';render();toast('Your tracker is ready 🎉')}
    catch(e){UI.busy='';render();toast('Could not create your sheet ('+(e.msg||e.code||'error')+')')}
  },
  'wk-preset':(el,id)=>{const w=WEEK_PRESETS[+id][2];document.querySelectorAll('.p-wk').forEach(x=>x.value=w[+x.dataset.d]);planSummary()},
  'wk-same':()=>{const h=$('#p-same').value;if(h==='')return;document.querySelectorAll('.p-wk').forEach(x=>x.value=Math.max(0,+h||0));planSummary()},
  'p-auto':()=>{$('#p-ghrs').value=Math.round(planTotal(formWeek(),$('#p-start').value,$('#p-gdate').value));toast('Goal set to your plan total')},
};
let autoAsk=0;
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;
  if(DB.sheetId&&!Auth.valid()&&navigator.onLine&&Auth.client&&!['signin','signout','reload'].includes(el.dataset.act)&&(outbox.length||Date.now()-Sync.last>600000)&&Date.now()-autoAsk>300000){autoAsk=Date.now();Auth.request()}if(el.tagName==='BUTTON'&&el.disabled)return;const f=ACT[el.dataset.act];if(f){if(el.dataset.act!=='ov')e.stopPropagation();f(el,el.dataset.id,e)}});
const CH={
  year:el=>{UI.year=el.value==='all'?'all':+el.value;UI.q='all';UI.month='all';render()},
  q:el=>{UI.q=el.value;UI.month='all';render()},
  month:el=>{UI.month=el.value;if(el.value!=='all')UI.q=String(Math.floor(+el.value/3));render()},
  'tf-status':el=>{UI.tf.status=el.value;render()},'tf-pri':el=>{UI.tf.pri=el.value;render()},'tf-subj':el=>{UI.tf.subj=el.value;render()},'tf-who':el=>{UI.tf.who=el.value;render()},
  't-task':el=>{T.s.taskId=el.value;const t=S.tasks.get(el.value);if(t&&t.subject)T.s.subject=t.subject;tSave();renderTimer()},
  't-subj':el=>{T.s.subject=el.value;tSave()},
  'p-exam':el=>{const p=PRESETS[el.value];if(!p)return;$('#p-goal').value=p.goal;$('#p-subj').value=p.subjects.join('\n');toast('Subjects set for '+el.value+' — edit freely')}
};
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el)});
let qT;document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&el.dataset.in==='tf-q'){clearTimeout(qT);qT=setTimeout(()=>{UI.tf.q=el.value;render()},200)}if(el&&el.dataset.in==='plan')planSummary()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;tick();if(DB.sheetId&&Date.now()-Sync.last>60000&&!$('#modalRoot').innerHTML)sync()});
window.addEventListener('online',()=>{render();sync()});window.addEventListener('offline',()=>render());
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Installed ✓');render()});

/* ============ BOOT ============ */
(function boot(){
  const h=(location.hash||'').slice(1);if(TABS_UI.some(t=>t[0]===h))UI.tab=h;
  Auth.init();tLoad();
  if(DB.sheetId)restore();
  render();
  setInterval(tick,500);
  let lastDay=todayStr();setInterval(()=>{if(todayStr()!==lastDay){lastDay=todayStr();buildS();render()}},60000);
  setInterval(()=>{if(!document.hidden&&DB.sheetId&&Date.now()-Sync.last>120000)sync()},30000);
  const g=document.createElement('script');g.src='https://accounts.google.com/gsi/client';g.async=true;g.onload=()=>{Auth.setup();render()};document.head.appendChild(g);
  if(Auth.valid())afterSignIn();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const watch=w=>w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){UI.update=w;render()}});
      if(reg.waiting&&navigator.serviceWorker.controller){UI.update=reg.waiting;render()}
      reg.addEventListener('updatefound',()=>watch(reg.installing));
      setInterval(()=>reg.update().catch(()=>{}),3600000);
    }).catch(()=>{});
    let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload()});
  }
})();
</script>
